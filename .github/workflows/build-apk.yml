name: Build Android APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      build_variant:
        description: "نوع ملف APK المطلوب بناؤه"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - debug
          - release

permissions:
  contents: write

jobs:
  build-apk:
    name: Build FolderPush APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK and accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          SDK_MANAGER=$(find "${SDK_DIR}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "${SDK_MANAGER}" ]; then
            yes | "${SDK_MANAGER}" --licenses >/dev/null 2>&1 || true
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-provider: basic

      - name: Prepare debug keystore and .env
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest --tests com.example.ExampleUnitTest --no-daemon

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_variant == 'debug' || inputs.build_variant == 'both' }}
        run: |
          gradle :app:assembleDebug --no-daemon
          mkdir -p apk-output
          cp app/build/outputs/apk/debug/*.apk apk-output/FolderPush-debug.apk

      - name: Build Release APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_variant == 'release' || inputs.build_variant == 'both' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          TEMP_KEYSTORE="${RUNNER_TEMP}/release-upload-key.jks"
          if [ -n "${SECRET_KEYSTORE_B64}" ] && [ -n "${SECRET_STORE_PASS}" ] && [ -n "${SECRET_KEY_PASS}" ]; then
            echo "${SECRET_KEYSTORE_B64}" | base64 -d > "${TEMP_KEYSTORE}"
            export KEYSTORE_PATH="${TEMP_KEYSTORE}"
            export STORE_PASSWORD="${SECRET_STORE_PASS}"
            export KEY_PASSWORD="${SECRET_KEY_PASS}"
          else
            echo "Release secrets not configured; generating temporary signing key for APK packaging."
            keytool -genkey -v \
              -keystore "${TEMP_KEYSTORE}" \
              -storepass folderpush123 \
              -alias upload \
              -keypass folderpush123 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=FolderPush,O=FolderPush,C=US"
            export KEYSTORE_PATH="${TEMP_KEYSTORE}"
            export STORE_PASSWORD="folderpush123"
            export KEY_PASSWORD="folderpush123"
          fi
          gradle :app:assembleRelease --no-daemon
          mkdir -p apk-output
          cp app/build/outputs/apk/release/*.apk apk-output/FolderPush-release.apk
          rm -f "${TEMP_KEYSTORE}"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: FolderPush-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "FolderPush ${GITHUB_REF_NAME}" \
            --generate-notes \
            apk-output/*.apk
